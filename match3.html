<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111923"><meta name="apple-mobile-web-app-capable" content="yes"><title>Just Three — endless match 3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111923;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none;user-select:none;-webkit-user-select:none}</style></head><body><canvas id="game"></canvas><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const COLORS=['#f4aa6d','#74c5bb','#b1a0ed','#ef8298','#e9ce73','#82a9eb'];let cols=8,rows=12,size=40,ox=0,oy=0,w=0,h=0,dpr=1,board=[],sprites=[],busy=false,selected=null,pointer=null,anim=0;const rand=n=>Math.floor(Math.random()*n),sleep=ms=>new Promise(r=>setTimeout(r,ms));function makeGem(t){let a=document.createElement('canvas');a.width=a.height=100;let c=a.getContext('2d');let grd=c.createRadialGradient(32,27,4,50,50,48);grd.addColorStop(0,'#ffffff');grd.addColorStop(.12,COLORS[t]);grd.addColorStop(.65,COLORS[t]);grd.addColorStop(1,'#172638');c.fillStyle=grd;c.beginPath();c.arc(50,50,43,0,7);c.fill();c.strokeStyle='#ffffff66';c.lineWidth=2;c.stroke();c.fillStyle='#ffffff66';c.beginPath();c.ellipse(34,27,17,9,-.6,0,7);c.fill();return a}sprites=COLORS.map((_,i)=>makeGem(i));function matches(){let hit=new Set();for(let y=0;y<rows;y++){let x=0;while(x<cols){let v=board[y][x],end=x+1;while(v>=0&&end<cols&&board[y][end]===v)end++;if(v>=0&&end-x>=3)for(let i=x;i<end;i++)hit.add(y*cols+i);x=end}}for(let x=0;x<cols;x++){let y=0;while(y<rows){let v=board[y][x],end=y+1;while(v>=0&&end<rows&&board[end][x]===v)end++;if(v>=0&&end-y>=3)for(let i=y;i<end;i++)hit.add(i*cols+x);y=end}}return hit}function validMove(){for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)for(let [dx,dy] of [[1,0],[0,1]]){let a=x+dx,b=y+dy;if(a>=cols||b>=rows)continue;[board[y][x],board[b][a]]=[board[b][a],board[y][x]];let yes=matches().size>0;[board[y][x],board[b][a]]=[board[b][a],board[y][x]];if(yes)return true}return false}function build(){board=Array.from({length:rows},()=>Array(cols).fill(0));for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let options=[0,1,2,3,4,5].filter(t=>!(x>1&&board[y][x-1]===t&&board[y][x-2]===t)&&!(y>1&&board[y-1][x]===t&&board[y-2][x]===t));board[y][x]=options[rand(options.length)]}if(!validMove())build()}function resize(){let oldC=cols,oldR=rows;w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);size=Math.max(26,Math.min(56,Math.floor(w/8)));cols=Math.max(5,Math.ceil(w/size));rows=Math.max(7,Math.ceil(h/size));size=Math.max(w/cols,h/rows);ox=(w-cols*size)/2;oy=(h-rows*size)/2;if(!board.length||oldC!==cols||oldR!==rows)build();selected=null}function paint(){ctx.fillStyle='#111923';ctx.fillRect(0,0,w,h);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let v=board[y]?.[x];if(v==null||v<0)continue;let px=ox+(x+.5)*size,py=oy+(y+.5)*size,r=size*.88;ctx.drawImage(sprites[v],px-r/2,py-r/2,r,r)}if(selected&&!busy){let {x,y}=selected;ctx.strokeStyle='#ffffff88';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ox+(x+.5)*size,oy+(y+.5)*size,size*.43,0,7);ctx.stroke()}requestAnimationFrame(paint)}function loc(e){let x=Math.floor((e.clientX-ox)/size),y=Math.floor((e.clientY-oy)/size);return x>=0&&x<cols&&y>=0&&y<rows?{x,y}:null}function swap(a,b){[board[a.y][a.x],board[b.y][b.x]]=[board[b.y][b.x],board[a.y][a.x]]}async function cascade(){let rounds=0;while(rounds++<80){let hits=matches();if(!hits.size)break;busy=true;await sleep(115);for(let id of hits)board[Math.floor(id/cols)][id%cols]=-1;await sleep(80);for(let x=0;x<cols;x++){let keep=[];for(let y=rows-1;y>=0;y--)if(board[y][x]>=0)keep.push(board[y][x]);for(let y=rows-1;y>=0;y--)board[y][x]=rows-1-y<keep.length?keep[rows-1-y]:rand(6)}await sleep(145)}if(!validMove())build();busy=false}async function trySwap(a,b){if(busy||!a||!b||Math.abs(a.x-b.x)+Math.abs(a.y-b.y)!==1)return;busy=true;swap(a,b);await sleep(110);if(matches().size){await cascade()}else{swap(a,b);await sleep(90);busy=false}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(busy)return;pointer={id:e.pointerId,start:loc(e),sx:e.clientX,sy:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!pointer||e.pointerId!==pointer.id)return;e.preventDefault();let p=pointer;pointer=null;if(busy||!p.start)return;let dx=e.clientX-p.sx,dy=e.clientY-p.sy;if(Math.hypot(dx,dy)>size*.22){let b={x:p.start.x+(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0),y:p.start.y+(Math.abs(dy)>=Math.abs(dx)?Math.sign(dy):0)};selected=null;if(b.x>=0&&b.x<cols&&b.y>=0&&b.y<rows)trySwap(p.start,b)}else{let target=loc(e);if(selected&&target&&Math.abs(selected.x-target.x)+Math.abs(selected.y-target.y)===1){let a=selected;selected=null;trySwap(a,target)}else selected=target}});canvas.addEventListener('pointercancel',()=>pointer=null);window.addEventListener('resize',resize);resize();requestAnimationFrame(paint)})();
</script></body></html>
