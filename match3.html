<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101823"><meta name="apple-mobile-web-app-capable" content="yes"><title>Three — tactile prototype</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101823;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#toggle{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 9px);background:#14212ab5;color:#dbe6e9;border:1px solid #ffffff28;border-radius:18px;font:11px system-ui;padding:7px 10px;opacity:.55;z-index:2}#toggle:active{opacity:1}</style></head><body><canvas id="c"></canvas><button id="toggle">Падение: ровное</button><script>
(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),toggle=document.getElementById('toggle');let W,H,D,cols,rows,S,OX,OY,board=[],balls=[],busy=false,drag=null,selected=null,chaos=false,audio=null,last=performance.now();const colors=['#f3a16c','#73c4bc','#aa9ae9','#ed8298','#e9cb70','#81a9eb'];const rnd=n=>Math.floor(Math.random()*n),wait=ms=>new Promise(r=>setTimeout(r,ms));const ease=t=>1-Math.pow(1-t,3);
toggle.onclick=()=>{chaos=!chaos;toggle.textContent='Падение: '+(chaos?'живое':'ровное')};
function audioOn(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function tick(strength=.6){if(!audio||audio.state!=='running')return;try{const t=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type='triangle';osc.frequency.setValueAtTime(620+Math.random()*90,t);osc.frequency.exponentialRampToValueAtTime(230+Math.random()*65,t+.035);filter.type='lowpass';filter.frequency.value=1250;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.019*strength,t+.002);gain.gain.exponentialRampToValueAtTime(.0001,t+.062);osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.068)}catch(e){}}
function pos(x,y){return {x:OX+(x+.5)*S,y:OY+(y+.5)*S}}
function ball(type,x,y){let p=pos(x,y);return {type,x:p.x,y:p.y,tx:p.x,ty:p.y,vx:0,vy:0,scale:1,opacity:1,dying:false,impact:false,wobble:0}}
function hits(){let set=new Set();for(let y=0;y<rows;y++){let x=0;while(x<cols){let v=board[y][x]?.type,k=x+1;while(v!==undefined&&k<cols&&board[y][k]?.type===v)k++;if(v!==undefined&&k-x>=3)for(let a=x;a<k;a++)set.add(y*cols+a);x=k}}for(let x=0;x<cols;x++){let y=0;while(y<rows){let v=board[y][x]?.type,k=y+1;while(v!==undefined&&k<rows&&board[k][x]?.type===v)k++;if(v!==undefined&&k-y>=3)for(let a=y;a<k;a++)set.add(a*cols+x);y=k}}return set}
function possible(){for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)for(let [dx,dy] of [[1,0],[0,1]]){let xx=x+dx,yy=y+dy;if(xx>=cols||yy>=rows)continue;[board[y][x],board[yy][xx]]=[board[yy][xx],board[y][x]];let ok=hits().size>0;[board[y][x],board[yy][xx]]=[board[yy][xx],board[y][x]];if(ok)return true}return false}
function build(){board=Array.from({length:rows},()=>Array(cols).fill(null));for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let types=colors.map((_,i)=>i).filter(t=>!(x>1&&board[y][x-1]?.type===t&&board[y][x-2]?.type===t)&&!(y>1&&board[y-1][x]?.type===t&&board[y-2][x]?.type===t));board[y][x]=ball(types[rnd(types.length)],x,y)}if(!possible())build()}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*D);c.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0);cols=Math.max(7,Math.round(W/44));S=W/cols;rows=Math.ceil(H/S)+1;OX=0;OY=(H-rows*S)/2;build();busy=false;drag=null;selected=null}
function paintBall(b){if(!b||b.opacity<=0)return;const r=S*.502*b.scale;g.save();g.globalAlpha=b.opacity;g.translate(b.x,b.y);if(chaos&&b.wobble)g.translate(Math.sin(b.y*.05+b.type)*b.wobble,0);g.beginPath();g.arc(0,0,r,0,Math.PI*2);const grad=g.createRadialGradient(-r*.35,-r*.42,r*.05,-r*.08,-r*.1,r*1.2);grad.addColorStop(0,'#ffffff');grad.addColorStop(.09,colors[b.type]);grad.addColorStop(.64,colors[b.type]);grad.addColorStop(1,'#263144');g.fillStyle=grad;g.fill();g.beginPath();g.ellipse(-r*.28,-r*.36,r*.24,r*.12,-.65,0,Math.PI*2);g.fillStyle='#ffffff50';g.fill();g.strokeStyle='#ffffff20';g.lineWidth=.7;g.beginPath();g.arc(0,0,r-.5,0,7);g.stroke();g.restore()}
function frame(now){const dt=Math.min(.033,(now-last)/1000||.016);last=now;g.fillStyle='#101823';g.fillRect(0,0,W,H);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let b=board[y][x];if(!b)continue;if(b.dying){b.scale=Math.max(0,b.scale-dt*4.8);b.opacity=Math.max(0,b.opacity-dt*4.8)}else if(!(drag&&drag.b===b)){let dx=b.tx-b.x,dy=b.ty-b.y;b.vx=(b.vx+dx*160*dt)*Math.exp(-17*dt);b.vy=(b.vy+dy*160*dt)*Math.exp(-17*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.abs(dy)<1.7&&Math.abs(b.vy)>45&&!b.impact){tick(.15);b.impact=true}if(Math.abs(dy)>S*.3)b.impact=false;b.wobble*=Math.exp(-8*dt)}paintBall(b)}requestAnimationFrame(frame)}
function locate(e){let x=Math.floor((e.clientX-OX)/S),y=Math.floor((e.clientY-OY)/S);return x>=0&&x<cols&&y>=0&&y<rows?{x,y}:null}
function exchange(a,b){[board[a.y][a.x],board[b.y][b.x]]=[board[b.y][b.x],board[a.y][a.x]];let p=pos(a.x,a.y),q=pos(b.x,b.y);Object.assign(board[a.y][a.x],{tx:p.x,ty:p.y});Object.assign(board[b.y][b.x],{tx:q.x,ty:q.y})}
async function resolve(){let round=0;while(round++<35){let set=hits();if(!set.size)break;await wait(125);tick(.55);for(let id of set){let y=Math.floor(id/cols),x=id%cols;board[y][x].dying=true}await wait(190);for(let x=0;x<cols;x++){let keep=[];for(let y=rows-1;y>=0;y--)if(board[y][x]&&!board[y][x].dying)keep.push(board[y][x]);for(let y=rows-1;y>=0;y--){let index=rows-1-y,b;if(index<keep.length)b=keep[index];else{b=ball(rnd(colors.length),x,y);b.y=OY-(index-keep.length+1)*S;b.vy=80}board[y][x]=b;let p=pos(x,y);b.tx=p.x;b.ty=p.y;b.impact=false;if(chaos){b.wobble=S*.09;b.vx+=(Math.random()-.5)*35}}}await wait(480)}if(!possible())build();busy=false}
async function move(a,b){if(busy||!a||!b||Math.abs(a.x-b.x)+Math.abs(a.y-b.y)!==1)return;busy=true;exchange(a,b);tick(.42);await wait(240);if(hits().size)await resolve();else{exchange(a,b);tick(.22);await wait(250);busy=false}}
c.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();if(busy)return;let p=locate(e);if(!p)return;drag={p,b:board[p.y][p.x],sx:e.clientX,sy:e.clientY};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drag||busy)return;let dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;drag.b.x=drag.b.tx+Math.max(-S,Math.min(S,dx));drag.b.y=drag.b.ty+Math.max(-S,Math.min(S,dy))});
c.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(busy)return;let dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(Math.hypot(dx,dy)>S*.24){let b={x:d.p.x+(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0),y:d.p.y+(Math.abs(dy)>=Math.abs(dx)?Math.sign(dy):0)};selected=null;if(b.x>=0&&b.x<cols&&b.y>=0&&b.y<rows)move(d.p,b)}else{let p=locate(e);if(selected&&p&&Math.abs(selected.x-p.x)+Math.abs(selected.y-p.y)===1){let a=selected;selected=null;move(a,p)}else selected=p}});
c.addEventListener('pointercancel',()=>{drag=null});window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script></body></html>
