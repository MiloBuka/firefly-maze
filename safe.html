<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>СЛОВОСЕЙФ — прототип</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101827;color:#e8edf5;font:15px system-ui,-apple-system,sans-serif}main{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}header{padding:13px 2px 5px;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;letter-spacing:3px;margin:0}.sub{font-size:12px;color:#aebbd0}#stage{flex:1;min-height:230px;position:relative;touch-action:none;display:grid;place-items:center}canvas{width:100%;height:100%;display:block;touch-action:none}#notice{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:13px;min-height:22px;color:#e9d6a7;pointer-events:none}.guess{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}.tile{width:54px;height:52px;display:grid;place-items:center;border:1px solid #657b94;border-radius:9px;background:#26374b;font-size:25px;font-weight:700}.tile.good{background:#287d60;border-color:#52cfa4}.history{min-height:25px;text-align:center;color:#aab8c9;font-size:12px}.actions{display:flex;gap:8px;padding:8px 0 14px}button{flex:1;border:1px solid #6b829d;border-radius:11px;padding:13px 8px;background:#263a52;color:white;font-size:14px}button.primary{background:#c49a54;border-color:#c49a54;color:#111827;font-weight:700}button:disabled{opacity:.4}#how{font-size:12px;line-height:1.45;color:#b8c4d4;text-align:center;padding-bottom:7px}</style></head><body><main><header><h1>СЛОВОСЕЙФ</h1><span class="sub" id="tries">5 проверок</span></header><div id="stage"><canvas id="canvas"></canvas><div id="notice"></div></div><div class="guess" id="guess"></div><div class="history" id="history"></div><div id="how">Вращай кольца пальцем или нажимай на буквы.<br>Найди загаданное слово из 4 букв.</div><div class="actions"><button id="next">Новый сейф</button><button id="check" class="primary">Проверить</button></div></main><script>
(()=>{const words=['КОРА','ЛУНА','РЕКА','ЗИМА','ЛЕТО','СОВА','РОЗА','МОРЕ','НОРА','ГОРА','ПОЛЕ','РУКА','НОГА','ЛИСА','РЫБА','ВОДА','ДОМА','НОЧЬ','ДЕНЬ','СНЕГ','СЛОН','СТОЛ','СТУЛ','КЛЮЧ','МЫЛО','ПЕРО','ЛИСТ','КНИГ','БАНК','КРАН','САДЫ','ТЕНЬ','ЛУЖА','МУХА','ЖУКИ','ПАРК','ТАНК','МЯЧИ','УТРО','ВЕТР','ТЕМА','ЛИЦО','ТЕЛО','КОФЕ','ЧАША','ЛАПА','КОТЫ','КОЗА','СЫРЫ','ПУМА','ЗОНА','СИЛА','МИРЫ','ИГРА','ОКНО','ДВОР','СУПЫ','ПУТЬ','РОТА','МЕТР','МЫШЬ','ШУБА','ДУША','ЗВУК','БЛИК','ФОНЫ','СЕТЬ','ПЛЕД','ХЛЕБ','ЛЕДИ','КРАБ','ПЛОТ','ПЛАН','ЗНАК','ПРУД','ЛУКИ','ПИОН','СОЛЬ','БОЛЬ','ЖАРА','ТУЧА','ЧУДО','ВРАЧ','ТРОН','ЗАЛЫ','КИНО','НОТА','СОКИ','ЛОСЬ','ПАРЫ','МИНА','МИРА','СЕНО','КУСТ','ПАУК','ЗАЯЦ','ВОЛК','КОШК'];const alphabet=[...'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЫЬЭЮЯ'];const sizes=[12,10,8,6],c=document.querySelector('#canvas'),ctx=c.getContext('2d'),guess=document.querySelector('#guess'),notice=document.querySelector('#notice'),history=document.querySelector('#history'),tries=document.querySelector('#tries'),check=document.querySelector('#check');let sets=[],idx=[],answer='',attempt=0,done=false,seen=[],W=320,H=320,R=[128,98,68,39],active=null;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fresh(){answer=words[Math.floor(Math.random()*words.length)];sets=Array.from(answer,(letter,i)=>shuffle([letter,...shuffle(alphabet.filter(x=>x!==letter)).slice(0,sizes[i]-1)]));idx=sets.map(s=>Math.floor(Math.random()*s.length));attempt=0;done=false;seen=[];notice.textContent='';history.textContent='';check.disabled=false;update()}function update(){tries.textContent=done?'Сейф открыт':(5-attempt)+' проверок';guess.innerHTML='';for(let i=0;i<4;i++){let el=document.createElement('div');el.className='tile';el.textContent=sets[i][idx[i]];el.onclick=()=>{if(!done){idx[i]=(idx[i]+1)%sets[i].length;update()}};guess.appendChild(el)} }function verify(){if(done)return;let current=sets.map((s,i)=>s[idx[i]]).join('');attempt++;let match=[...current].map((x,i)=>x===answer[i]);[...guess.children].forEach((el,i)=>el.classList.toggle('good',match[i]));seen.push(current+'  '+match.map(x=>x?'●':'○').join(''));history.textContent=seen.slice(-2).join('   ·   ');if(match.every(Boolean)){done=true;notice.textContent='ЩЁЛК! Сейф открыт. Слово: '+answer;check.disabled=true}else if(attempt>=5){done=true;notice.textContent='Попытки кончились. Слово: '+answer;check.disabled=true}else{notice.textContent='Зелёный — буква на правильном месте';}tries.textContent=done?'Раунд завершён':(5-attempt)+' проверок'}function resize(){let rect=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=rect.width;H=rect.height;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);let scale=Math.min(W/320,H/320,1.25);R=[128,98,68,39].map(v=>v*scale)}function draw(){ctx.clearRect(0,0,W,H);let x=W/2,y=H/2;ctx.fillStyle='#152133';ctx.beginPath();ctx.arc(x,y,R[0]+19,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#6d8097';ctx.lineWidth=3;ctx.stroke();for(let i=0;i<4;i++){let radius=R[i],n=sets[i].length;ctx.strokeStyle=['#5b8194','#797f9a','#9c8c8a','#b19a72'][i];ctx.lineWidth=i===3?23:27;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.stroke();for(let k=0;k<n;k++){let angle=(k-idx[i])*Math.PI*2/n-Math.PI/2,tx=x+Math.cos(angle)*radius,ty=y+Math.sin(angle)*radius;ctx.save();ctx.translate(tx,ty);ctx.fillStyle=k===idx[i]?'#fff0c7':'#d3deeb';ctx.font=(k===idx[i]?'bold ':'')+'14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sets[i][k],0,0);ctx.restore()}}ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(x,y,19,0,7);ctx.fill();ctx.strokeStyle='#d2ae6b';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#e8c889';ctx.beginPath();ctx.moveTo(x-6,y-5);ctx.lineTo(x+6,y);ctx.lineTo(x-6,y+5);ctx.fill();ctx.strokeStyle='#eac77e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-R[0]-21);ctx.lineTo(x,y-R[0]-7);ctx.stroke()}function frame(){draw();requestAnimationFrame(frame)}function pointer(e){let r=c.getBoundingClientRect(),x=e.clientX-r.left-W/2,y=e.clientY-r.top-H/2;return {angle:Math.atan2(y,x),dist:Math.hypot(x,y)}}c.addEventListener('pointerdown',e=>{if(done)return;e.preventDefault();let p=pointer(e),i=R.findIndex(r=>Math.abs(p.dist-r)<17);if(i<0)return;active={id:e.pointerId,i,last:p.angle,acc:0};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!active||e.pointerId!==active.id)return;e.preventDefault();let p=pointer(e),diff=p.angle-active.last;if(diff>Math.PI)diff-=2*Math.PI;if(diff< -Math.PI)diff+=2*Math.PI;active.last=p.angle;active.acc+=diff;let step=2*Math.PI/sets[active.i].length;while(active.acc>step*.65){idx[active.i]=(idx[active.i]-1+sets[active.i].length)%sets[active.i].length;active.acc-=step;update()}while(active.acc< -step*.65){idx[active.i]=(idx[active.i]+1)%sets[active.i].length;active.acc+=step;update()}});function end(e){if(active&&e.pointerId===active.id)active=null}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);document.querySelector('#next').onclick=fresh;check.onclick=verify;window.addEventListener('resize',resize);fresh();resize();requestAnimationFrame(frame)})();
</script></body></html>
