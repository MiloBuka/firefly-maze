<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>FIREFLY — лабиринт наоборот</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#101827;color:#edf2ff;font:14px system-ui,-apple-system,sans-serif}main{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header,footer{padding:12px;display:flex;gap:12px;align-items:center;justify-content:space-between}header b{letter-spacing:3px}#board{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;bottom:14px;left:10px;right:10px;text-align:center;font-size:12px;color:#a9b8d0;pointer-events:none}button{flex:1;background:#29394f;border:1px solid #60718a;border-radius:12px;color:white;padding:13px 8px;font-size:14px}</style></head><body><main><header><b>FIREFLY</b><span id="status">Тяни лабиринт пальцем</span></header><div id="board"><canvas id="c"></canvas><div id="hint">Найди голубое сияние · отпусти палец для возврата</div></div><footer><button id="new">Новый лабиринт</button><button id="center">В центр</button></footer></main><script>
(()=>{const board=document.querySelector('#board'),canvas=document.querySelector('#c'),g=canvas.getContext('2d'),status=document.querySelector('#status');let W=1,H=1,dpr=1,C=52,N=21,grid=[],x=0,y=0,cx=0,cy=0,sx=0,sy=0,goal=[0,0],finger=null,won=false,trail=[0,0];const random=n=>Math.floor(Math.random()*n);function generate(){grid=Array.from({length:N},()=>Array(N).fill(1));let stack=[[1,1]];grid[1][1]=0;while(stack.length){let [a,b]=stack[stack.length-1],ds=[[2,0],[-2,0],[0,2],[0,-2]];for(let i=ds.length-1;i>0;i--){let j=random(i+1);[ds[i],ds[j]]=[ds[j],ds[i]]}let moved=false;for(let [dx,dy] of ds){let u=a+dx,v=b+dy;if(u>0&&v>0&&u<N-1&&v<N-1&&grid[v][u]){grid[b+dy/2][a+dx/2]=0;grid[v][u]=0;stack.push([u,v]);moved=true;break}}if(!moved)stack.pop()}let q=[[1,1,0]],seen=new Set(['1,1']),best=q[0];for(let i=0;i<q.length;i++){let [a,b,d]=q[i];if(d>best[2])best=q[i];for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let u=a+dx,v=b+dy,k=u+','+v;if(u>=0&&v>=0&&u<N&&v<N&&!grid[v][u]&&!seen.has(k)){seen.add(k);q.push([u,v,d+1])}}}goal=[(best[0]+.5)*C,(best[1]+.5)*C];x=y=1.5*C;cx=x;cy=y;sx=sy=0;finger=null;won=false;trail=[0,0];status.textContent='Тяни лабиринт пальцем'}function resize(){let r=board.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0)}function wall(a,b){let i=Math.floor(a/C),j=Math.floor(b/C);return i<0||j<0||i>=N||j>=N||grid[j][i]===1}function blocked(a,b){let r=9;return wall(a-r,b-r)||wall(a+r,b-r)||wall(a-r,b+r)||wall(a+r,b+r)}function move(dx,dy){let n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/3)),ax=0,ay=0;for(let i=0;i<n;i++){let u=dx/n,v=dy/n;if(!blocked(x+u,y)){x+=u;ax+=u}if(!blocked(x,y+v)){y+=v;ay+=v}}trail=[ax,ay];if(!won&&Math.hypot(x-goal[0],y-goal[1])<C*.3){won=true;status.textContent='Выход найден!'}return [ax,ay]}function pos(e){let r=board.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}board.addEventListener('pointerdown',e=>{e.preventDefault();let [a,b]=pos(e);finger={id:e.pointerId,a,b};board.setPointerCapture(e.pointerId)});board.addEventListener('pointermove',e=>{if(!finger||finger.id!==e.pointerId)return;e.preventDefault();let [a,b]=pos(e),dx=a-finger.a,dy=b-finger.b;finger.a=a;finger.b=b;let [mx,my]=move(-dx,-dy);sx=Math.max(-75,Math.min(75,sx+dx+mx));sy=Math.max(-75,Math.min(75,sy+dy+my))});function release(e){if(finger&&finger.id===e.pointerId)finger=null}board.addEventListener('pointerup',release);board.addEventListener('pointercancel',release);document.querySelector('#new').onclick=generate;document.querySelector('#center').onclick=()=>{finger=null;cx=x;cy=y;sx=sy=0};function draw(t){if(!finger){sx*=.84;sy*=.84}cx+=(x-cx)*.19;cy+=(y-cy)*.19;let ox=W/2-cx+sx,oy=H/2-cy+sy;g.fillStyle='#101827';g.fillRect(0,0,W,H);let i0=Math.max(0,Math.floor(-ox/C)-1),i1=Math.min(N-1,Math.ceil((W-ox)/C)+1),j0=Math.max(0,Math.floor(-oy/C)-1),j1=Math.min(N-1,Math.ceil((H-oy)/C)+1);for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){let a=ox+i*C,b=oy+j*C;if(grid[j][i]){g.fillStyle='#354760';g.fillRect(a,b,C+.5,C+.5);g.fillStyle='#4c6280';g.fillRect(a+3,b+3,C-6,3)}else{g.fillStyle='#1b2a3d';g.fillRect(a,b,C+.5,C+.5)}}let gx=ox+goal[0],gy=oy+goal[1];g.fillStyle='#67e8f966';g.beginPath();g.arc(gx,gy,25,0,7);g.fill();g.strokeStyle='#67e8f9';g.lineWidth=3;g.beginPath();g.arc(gx,gy,14+Math.sin(t/250)*2,0,7);g.stroke();let fx=ox+x,fy=oy+y;if(finger&&Math.hypot(...trail)>.4){let a=Math.atan2(trail[1],trail[0]),l=Math.min(42,15+Math.hypot(...trail)*2);g.strokeStyle='#fbbf2488';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(fx,fy);g.lineTo(fx-Math.cos(a)*l,fy-Math.sin(a)*l);g.stroke()}let glow=g.createRadialGradient(fx,fy,0,fx,fy,30);glow.addColorStop(0,'#fde68aaa');glow.addColorStop(1,'#fbbf2400');g.fillStyle=glow;g.beginPath();g.arc(fx,fy,30,0,7);g.fill();g.fillStyle='#fff3c4';g.beginPath();g.arc(fx,fy,8,0,7);g.fill();trail=trail.map(v=>v*.7);requestAnimationFrame(draw)}resize();generate();window.addEventListener('resize',resize);requestAnimationFrame(draw)})();
</script></body></html>
